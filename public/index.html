<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScreenCast</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="card">
  <h1>ScreenCast</h1>
  <p class="sub">Share your screen with anyone, anywhere. No account, no install.</p>

  <a class="btn" href="share.html">Start casting</a>
  <p class="sub" style="margin-top:8px">Get a code, send it to the person who should watch.</p>

  <hr>

  <b>Got a code?</b>
  <div class="row">
    <input id="room" maxlength="6" placeholder="CODE" autocomplete="off">
    <button id="go">Watch</button>
  </div>
</div>
<script>
const go = () => {
  const c = document.getElementById('room').value.trim().toUpperCase();
  if (c) location.href = 'watch.html?room=' + encodeURIComponent(c);
};
document.getElementById('go').onclick = go;
document.getElementById('room').addEventListener('keydown', (e) => e.key === 'Enter' && go());
</script>
</body></html>
